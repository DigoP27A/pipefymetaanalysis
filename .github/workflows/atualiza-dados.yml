name: Atualiza dados do Pipefy

on:
  schedule:
    # Segunda-feira 08:00 BRT (UTC-3) = 11:00 UTC
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualiza-dados
  cancel-in-progress: false

jobs:
  atualiza:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipefy-crm

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pipefy-crm/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar extrator do Pipefy
        env:
          PIPEFY_TOKEN: ${{ secrets.PIPEFY_TOKEN }}
          PIPE_ID: ${{ secrets.PIPE_ID }}
        run: python extrator.py

      - name: Commit e push se os dados mudaram
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cards_raw.json dados/cards.csv dados/relatorio_completo.xlsx
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados — nada a commitar."
          else
            git commit -m "chore: atualiza dados do Pipefy [skip ci]"
            git push
          fi
